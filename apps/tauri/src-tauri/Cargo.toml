[package]
name = "bookie_clicker"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bookie_clicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bookie_core = { path = "../../../packages/core" }
async-trait = "0.1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surrealdb = { version = "2.0", default-features = false, features = ["kv-mem"] }
dirs = "6"
tokio = "1"
tauri-plugin-http = "2"
time = { version = "0.3", features = ["formatting"] }
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
rxing = "0.8.3"
image = "0.25.9"
base64 = "0.22.1"

[features]
# 本番ビルド時に `--features release-storage` をつけることでRocksDBを有効化
release-storage = ["surrealdb/kv-rocksdb"]
