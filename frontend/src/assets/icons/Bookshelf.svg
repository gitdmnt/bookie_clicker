<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="bookshelfTitle bookshelfDesc" stroke="currentColor" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <title id="bookshelfTitle">Bookshelf</title>
    <desc id="bookshelfDesc">Icon of a bookshelf with books and a shelf</desc>

    <!-- shelf -->
    <rect x="2" y="17.5" width="20" height="2" rx="0.5" fill="currentColor" stroke="none"/>

    <!-- upright books -->
    <rect x="3" y="5" width="3.2" height="12" rx="0.3"/>
    <path d="M5.6 7.5v7" />
    <rect x="7.8" y="6.2" width="3.2" height="10.8" rx="0.3"/>
    <path d="M10.2 8.2v6.6" />
    <rect x="12.6" y="4.8" width="3.6" height="12.2" rx="0.3"/>
    <path d="M14.6 6.5v9.2" />

    <!-- leaning book -->
    <g transform="rotate(-12 19 11)">
        <rect x="17.4" y="7.2" width="3" height="7.2" rx="0.3"/>
        <path d="M18.9 8.5v4.6" />
